<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F9UM SERVICES | OSINT Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Fond sombre premium */
            --bg-color: #080711;
            
            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-card-bg: rgba(20, 16, 38, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.04);
            
            /* Couleurs Accents Néon */
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            
            /* Textes */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-border;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- ARRIÈRE-PLAN VISUEL SOMBRE & PREMIUM --- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
            z-index: -2;
            filter: blur(40px);
        }

        /* Grille cyber discrète */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- TITTRE EN HAUT AVEC EFFET GLASSMORPHISM --- */
        .glass-header {
            padding: 18px 45px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        .glass-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 70%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
        }

        .glass-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* --- CONSOLE DE RECHERCHE GLASSMORPHISM --- */
        .search-card {
            width: 100%;
            background: var(--glass-card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            gap: 12px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            position: relative;
            box-sizing: border-box;
        }

        select, input {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(10, 8, 20, 0.6);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        select {
            flex: 0 0 200px;
            cursor: pointer;
        }

        input {
            flex: 1;
        }

        select:focus, input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            background: rgba(10, 8, 20, 0.85);
        }

        /* Bouton Rechercher */
        button.btn-search {
            padding: 0 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
            filter: brightness(1.1);
        }

        button.btn-search:active {
            transform: translateY(1px);
        }

        /* --- ZONE DE RÉSULTATS --- */
        #resultsArea {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
        }

        .results-header {
            grid-column: 1 / -1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* Cartes de résultats Glass */
        .result-card {
            background: var(--glass-card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 22px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .result-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .field-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-purple);
        }

        .field-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .field-value {
            font-size: 14px;
            font-weight: 500;
            word-break: break-all;
        }

        .badge-container {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(59, 130, 246, 0.12);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .confidence-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--glass-card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 30px;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .search-card {
                flex-direction: column;
            }
            select, input, button.btn-search {
                width: 100%;
                flex: none;
            }
            button.btn-search {
                padding: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- TITRE HAUT AVEC EFFET VERRE -->
    <div class="glass-header">
        <h1>F9UM SERVICES</h1>
        <p>Intelligence & Data Intelligence Platform</p>
    </div>

    <!-- MODULE DE RECHERCHE -->
    <div class="search-card">
        <select id="moduleSelect">
            <option value="fullname">Nom & Prénom</option>
            <option value="email">Adresse E-mail</option>
            <option value="phone">Téléphone</option>
        </select>
        <input type="text" id="queryInput" placeholder="Ex: Jean Dupont">
        <button class="btn-search" onclick="lancerRecherche()">Rechercher</button>
    </div>

    <!-- RESULTATS -->
    <div id="resultsArea"></div>
</div>

<script>
    async function lancerRecherche() {
        const queryInput = document.getElementById('queryInput');
        const query = queryInput.value.trim();
        const module = document.getElementById('moduleSelect').value;
        const area = document.getElementById('resultsArea');

        if (!query) return;

        area.innerHTML = `
            <div class="status-msg" style="color: var(--accent-cyan);">
                Recherche en cours dans les registres...
            </div>
        `;

        try {
            const res = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query, module: module })
            });

            const data = await res.json();
            area.innerHTML = '';

            const list = data?.data?.results || [];

            if (list.length === 0) {
                area.innerHTML = '<div class="status-msg">Aucun résultat correspondant trouvé.</div>';
                return;
            }

            const totalCount = data?.meta?.total || list.length;
            area.innerHTML = `<div class="results-header">${totalCount} résultat(s) trouvé(s)</div>`;

            list.forEach(item => {
                const sources = item._sources || (item._source_db ? [item._source_db] : []);
                let sourcesHtml = sources.map(s => `<span class="badge">${s}</span>`).join('');

                const confHtml = item._confidence ? `<span class="confidence-badge">Score: ${item._confidence}%</span>` : '';

                const keyMap = [
                    { key: 'prenom', label: 'Prénom' },
                    { key: 'nom_famille', label: 'Nom' },
                    { key: 'telephone', label: 'Téléphone' },
                    { key: 'email', label: 'E-mail' },
                    { key: 'adresse', label: 'Adresse' },
                    { key: 'code_postal', label: 'Code Postal' },
                    { key: 'ville', label: 'Ville' },
                    { key: 'nom_utilisateur', label: 'Identifiant / Pseudo' }
                ];

                let fieldsHtml = '';
                keyMap.forEach(field => {
                    if (item[field.key]) {
                        fieldsHtml += `
                            <div class="field-box">
                                <div class="field-label">${field.label}</div>
                                <div class="field-value">${item[field.key]}</div>
                            </div>
                        `;
                    }
                });

                const card = `
                    <div class="result-card">
                        ${confHtml}
                        <div class="card-grid">${fieldsHtml}</div>
                        <div class="badge-container">${sourcesHtml}</div>
                    </div>
                `;
                area.innerHTML += card;
            });

        } catch (err) {
            area.innerHTML = `<div class="status-msg" style="border-color: #ef4444; color: #f87171;">Erreur de connexion : ${err.message}</div>`;
        }
    }

    document.getElementById('queryInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            lancerRecherche();
        }
    });
</script>

</body>
</html>
