<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F9UM SERVICES | OSINT Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --glass-card: rgba(15, 15, 22, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.22);
            --neon-purple: #8b5cf6;
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .light-beam {
            position: fixed;
            top: -30%; left: -30%;
            width: 160vw; height: 160vh;
            background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.22) 0%, rgba(59, 130, 246, 0.12) 35%, transparent 80%);
            filter: blur(100px);
            z-index: -2;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-section {
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .glass-header {
            padding: 20px 50px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .glass-header h1 {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
        }

        /* Sections / Accordéons multicritères */
        .search-builder {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .filter-section {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--neon-purple);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: #050508;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            background: #08080f;
        }

        .action-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        button.btn-search {
            padding: 16px 50px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: #ffffff;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.6);
            filter: brightness(1.15);
        }

        #resultsArea {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 24px;
            animation: fadeInUp 0.4s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px;
            border-radius: 10px;
            border-left: 3px solid var(--neon-purple);
        }

        .badge {
            font-family: var(--font-mono);
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .spinner {
            width: 45px; height: 45px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-radius: 50%;
            border-top-color: var(--neon-cyan);
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="light-beam"></div>

<div class="container">
    <section class="hero-section">
        <div class="glass-header">
            <h1>F9UM SERVICES</h1>
        </div>
        <p style="color: var(--text-muted); font-family: var(--font-mono);">Plateforme de recherche multicritères avancée</p>
    </section>

    <!-- Formulaire Multicritères -->
    <div class="search-builder">
        <!-- Identité -->
        <div class="filter-section">
            <div class="section-title">👤 Identité</div>
            <div class="fields-grid">
                <div class="field-group">
                    <label>Nom</label>
                    <input type="text" id="nom_famille" placeholder="Ex: Dupont">
                </div>
                <div class="field-group">
                    <label>Prénom</label>
                    <input type="text" id="prenom" placeholder="Ex: Jean">
                </div>
                <div class="field-group">
                    <label>Nom de naissance</label>
                    <input type="text" id="nom_naissance" placeholder="Ex: Martin">
                </div>
                <div class="field-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="nom_utilisateur" placeholder="Ex: Pseudo123">
                </div>
            </div>
        </div>

        <!-- Contact -->
        <div class="filter-section">
            <div class="section-title">✉️ Contact</div>
            <div class="fields-grid">
                <div class="field-group">
                    <label>Adresse E-mail</label>
                    <input type="text" id="email" placeholder="Ex: nom@exemple.com">
                </div>
                <div class="field-group">
                    <label>Téléphone</label>
                    <input type="text" id="telephone" placeholder="Ex: 0612345678">
                </div>
                <div class="field-group">
                    <label>Adresse IP</label>
                    <input type="text" id="adresse_ip" placeholder="Ex: 192.168.1.1">
                </div>
                <div class="field-group">
                    <label>Discord ID</label>
                    <input type="text" id="discord_id" placeholder="Ex: 282859044593598464">
                </div>
            </div>
        </div>

        <!-- Localisation -->
        <div class="filter-section">
            <div class="section-title">📍 Localisation</div>
            <div class="fields-grid">
                <div class="field-group">
                    <label>Adresse</label>
                    <input type="text" id="adresse" placeholder="Ex: 12 Rue de la Paix">
                </div>
                <div class="field-group">
                    <label>Code Postal</label>
                    <input type="text" id="code_postal" placeholder="Ex: 58500">
                </div>
                <div class="field-group">
                    <label>Ville</label>
                    <input type="text" id="ville" placeholder="Ex: Paris">
                </div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-search" onclick="lancerRechercheMulticritere()">Lancer la recherche multicritères</button>
    </div>

    <div id="resultsArea"></div>
</div>

<script>
    async function lancerRechercheMulticritere() {
        const area = document.getElementById('resultsArea');

        // Récupérer les valeurs de tous les champs remplis
        const payloadData = {
            nom_famille: document.getElementById('nom_famille').value.trim(),
            prenom: document.getElementById('prenom').value.trim(),
            nom_naissance: document.getElementById('nom_naissance').value.trim(),
            nom_utilisateur: document.getElementById('nom_utilisateur').value.trim(),
            email: document.getElementById('email').value.trim(),
            telephone: document.getElementById('telephone').value.trim(),
            adresse_ip: document.getElementById('adresse_ip').value.trim(),
            discord_id: document.getElementById('discord_id').value.trim(),
            adresse: document.getElementById('adresse').value.trim(),
            code_postal: document.getElementById('code_postal').value.trim(),
            ville: document.getElementById('ville').value.trim(),
            flexible: true,
            per_page: 15
        };

        // Filtrer pour ne garder que les champs remplis
        const activeFilters = Object.fromEntries(Object.entries(payloadData).filter(([_, v]) => v !== "" && v !== true));

        if (Object.keys(activeFilters).length === 0) {
            area.innerHTML = `
                <div class="result-card">
                    <div class="field-box" style="border-left-color: #ef4444;">
                        <p style="color: #ef4444; font-family: var(--font-mono);">Veuillez remplir au moins un critère de recherche.</p>
                    </div>
                </div>`;
            return;
        }

        area.innerHTML = `
            <div style="text-align: center; padding: 30px;">
                <div class="spinner"></div>
                <p style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: 15px;">
                    Recherche multicritères en cours...
                </p>
            </div>`;

        try {
            const RENDER_URL = "https://f9um-services.onrender.com"; 
            const response = await fetch(`${RENDER_URL}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payloadData)
            });

            if (!response.ok) throw new Error(`Erreur serveur : ${response.status}`);

            const data = await response.json();

            if (data.status === 'success' && data.results && data.results.length > 0) {
                let htmlResults = '';
                data.results.forEach(item => {
                    htmlResults += `
                        <div class="result-card">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <span class="badge">SOURCE : ${item.source || 'F9UM API'}</span>
                            </div>
                            <div class="field-box">
                                <p style="color: var(--text-main); font-size: 0.95rem; font-family: var(--font-mono); white-space: pre-line; word-break: break-all;">
                                    ${item.data}
                                </p>
                            </div>
                        </div>
                    `;
                });
                area.innerHTML = htmlResults;
            } else {
                area.innerHTML = `
                    <div class="result-card">
                        <div class="field-box" style="border-left-color: var(--neon-cyan);">
                            <p style="color: var(--neon-cyan); font-family: var(--font-mono);">Aucun résultat trouvé pour cette combinaison de critères.</p>
                        </div>
                    </div>`;
            }

        } cat (err) {
            area.innerHTML = `
                <div class="result-card" style="border-color: rgba(239, 68, 68, 0.5);">
                    <div class="field-box" style="border-left-color: #ef4444;">
                        <p style="color: #ef4444; font-weight: 700; margin-bottom: 5px;">Erreur de communication</p>
                        <p style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-mono);">${err.message}</p>
                    </div>
                </div>`;
        }
    }
</script>

</body>
</html>
