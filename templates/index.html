<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F9UM SERVICES | OSINT Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-card: rgba(15, 15, 22, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.22);
            --neon-purple: #8b5cf6;
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .light-beam {
            position: fixed;
            top: -30%;
            left: -30%;
            width: 160vw;
            height: 160vh;
            background: radial-gradient(
                circle at 50% 50%, 
                rgba(139, 92, 246, 0.22) 0%, 
                rgba(59, 130, 246, 0.12) 35%, 
                rgba(6, 182, 212, 0.04) 60%, 
                transparent 80%
            );
            filter: blur(100px);
            z-index: -2;
            pointer-events: none;
            animation: moveBeam 14s infinite alternate ease-in-out;
        }

        @keyframes moveBeam {
            0% { transform: translate(-10%, -10%) rotate(0deg) scale(1); }
            50% { transform: translate(15%, 10%) rotate(180deg) scale(1.15); }
            100% { transform: translate(-5%, 15%) rotate(360deg) scale(0.95); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-section {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        .records-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .records-badge:hover {
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.15);
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--neon-green);
            animation: slowPulse 2.5s infinite ease-in-out;
        }

        @keyframes slowPulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px var(--neon-green); }
            50% { opacity: 0.25; transform: scale(0.85); box-shadow: 0 0 2px var(--neon-green); }
        }

        .glass-header {
            padding: 25px 65px;
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px var(--glass-shine);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .glass-header:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .glass-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(255, 255, 255, 0.12) 50%, transparent 55%);
            animation: shineSweep 7s infinite;
            pointer-events: none;
        }

        @keyframes shineSweep {
            0% { transform: translate(-100%, -100%); }
            20%, 100% { transform: translate(100%, 100%); }
        }

        .glass-header h1 {
            font-family: var(--font-mono);
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 
                0 1px 0 #cccccc, 0 2px 0 #c9c9c9, 0 3px 0 #bbb, 0 4px 0 #b9b9b9, 0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.5), 0 0 15px rgba(139, 92, 246, 0.6), 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .typing-container {
            font-size: 1.4rem;
            color: var(--text-muted);
            font-weight: 500;
            min-height: 40px;
        }

        .typed-text {
            color: var(--neon-cyan);
            font-family: var(--font-mono);
            font-weight: 700;
            border-right: 3px solid var(--neon-purple);
            padding-right: 5px;
            animation: blinkCursor 0.75s step-end infinite;
        }

        @keyframes blinkCursor {
            from, to { border-color: transparent }
            50% { border-color: var(--neon-purple); }
        }

        .btn-hero {
            padding: 18px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: #ffffff;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.35);
            display: inline-block;
        }

        .btn-hero:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.55);
            filter: brightness(1.1);
        }

        .search-section {
            width: 100%;
            padding-top: 50px;
        }

        .search-builder {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .filter-section {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        .filter-section:hover {
            border-color: rgba(139, 92, 246, 0.3);
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--neon-purple);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: #050508;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            background: #08080f;
        }

        .action-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        button.btn-search {
            padding: 18px 50px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: #ffffff;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.6);
            filter: brightness(1.15);
        }

        #resultsArea {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 24px;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px;
            border-radius: 10px;
            border-left: 3px solid var(--neon-purple);
        }

        .badge {
            font-family: var(--font-mono);
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 30px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-radius: 50%;
            border-top-color: var(--neon-cyan);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="light-beam"></div>

<div class="container">
    <section class="hero-section">
        <div class="records-badge">
            <span class="green-dot"></span>
            11 102 943 233 enregistrements indexés
        </div>

        <div class="glass-header">
            <h1>F9UM SERVICES</h1>
        </div>

        <div class="typing-container">
            Une plateforme OSINT faite pour <span class="typed-text" id="typewriter"></span>
        </div>

        <a href="#searchSection" class="btn-hero">Lancer une recherche</a>
    </section>

    <section id="searchSection" class="search-section">
        <div class="search-builder">
            <!-- Identité -->
            <div class="filter-section">
                <div class="section-title">👤 Identité</div>
                <div class="fields-grid">
                    <div class="field-group">
                        <label>Nom</label>
                        <input type="text" id="nom_famille" placeholder="Ex: Dupont" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Prénom</label>
                        <input type="text" id="prenom" placeholder="Ex: Jean" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Nom de naissance</label>
                        <input type="text" id="nom_naissance" placeholder="Ex: Martin" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="nom_utilisateur" placeholder="Ex: Pseudo123" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                </div>
            </div>

            <!-- Contact -->
            <div class="filter-section">
                <div class="section-title">✉️ Contact</div>
                <div class="fields-grid">
                    <div class="field-group">
                        <label>Adresse E-mail</label>
                        <input type="text" id="email" placeholder="Ex: nom@exemple.com" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Téléphone</label>
                        <input type="text" id="telephone" placeholder="Ex: 0612345678" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Adresse IP</label>
                        <input type="text" id="adresse_ip" placeholder="Ex: 192.168.1.1" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Discord ID</label>
                        <input type="text" id="discord_id" placeholder="Ex: 282859044593598464" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                </div>
            </div>

            <!-- Localisation -->
            <div class="filter-section">
                <div class="section-title">📍 Localisation</div>
                <div class="fields-grid">
                    <div class="field-group">
                        <label>Adresse</label>
                        <input type="text" id="adresse" placeholder="Ex: 12 Rue de la Paix" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Code Postal</label>
                        <input type="text" id="code_postal" placeholder="Ex: 58500" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                    <div class="field-group">
                        <label>Ville</label>
                        <input type="text" id="ville" placeholder="Ex: Clamecy" onkeypress="if(event.key === 'Enter') lancerRechercheMulticritere()">
                    </div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-search" onclick="lancerRechercheMulticritere()">Lancer la recherche multicritères</button>
        </div>

        <div id="resultsArea"></div>
    </section>
</div>

<script>
    const words = ["les enquêteurs.", "les analystes.", "la recherche de données.", "la cybersécurité."];
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typewriterElement = document.getElementById("typewriter");

    function typeEffect() {
        const currentWord = words[wordIndex];
        if (isDeleting) {
            typewriterElement.textContent = currentWord.substring(0, charIndex - 1);
            charIndex--;
        } else {
            typewriterElement.textContent = currentWord.substring(0, charIndex + 1);
            charIndex++;
        }

        let typeSpeed = isDeleting ? 40 : 90;
        if (!isDeleting && charIndex === currentWord.length) {
            typeSpeed = 2200;
            isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            wordIndex = (wordIndex + 1) % words.length;
            typeSpeed = 400;
        }
        setTimeout(typeEffect, typeSpeed);
    }
    document.addEventListener("DOMContentLoaded", typeEffect);

    // Fonction modifiée : Utilisation de GET avec passage des paramètres dans l'URL
    async function lancerRechercheMulticritere() {
        const area = document.getElementById('resultsArea');

        const payloadData = {
            nom_famille: document.getElementById('nom_famille').value.trim(),
            prenom: document.getElementById('prenom').value.trim(),
            nom_naissance: document.getElementById('nom_naissance').value.trim(),
            nom_utilisateur: document.getElementById('nom_utilisateur').value.trim(),
            email: document.getElementById('email').value.trim(),
            telephone: document.getElementById('telephone').value.trim(),
            adresse_ip: document.getElementById('adresse_ip').value.trim(),
            discord_id: document.getElementById('discord_id').value.trim(),
            adresse: document.getElementById('adresse').value.trim(),
            code_postal: document.getElementById('code_postal').value.trim(),
            ville: document.getElementById('ville').value.trim(),
            flexible: true,
            per_page: 15
        };

        const activeFilters = Object.fromEntries(Object.entries(payloadData).filter(([_, v]) => v !== "" && v !== true));

        if (Object.keys(activeFilters).length === 0) {
            area.innerHTML = `
                <div class="result-card">
                    <div class="field-box" style="border-left-color: #ef4444;">
                        <p style="color: #ef4444; font-family: var(--font-mono);">Veuillez remplir au moins un critère de recherche.</p>
                    </div>
                </div>`;
            return;
        }

        area.innerHTML = `
            <div class="spinner-container">
                <div class="spinner"></div>
                <p style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-mono);">
                    Connexion au serveur Render... (Réveil potentiel ~30s)
                </p>
            </div>
        `;

        try {
            const RENDER_URL = "https://f9um-services.onrender.com"; 
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 45000);

            // Construction des query parameters pour la requête GET
            const queryParams = new URLSearchParams(Object.entries(payloadData).filter(([_, v]) => v !== "" && v !== false));

            const response = await fetch(`${RENDER_URL}/search?${queryParams.toString()}`, {
                method: 'GET',
                signal: controller.signal,
                headers: { 
                    'Accept': 'application/json' 
                }
            });
            
            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error(`Erreur serveur : ${response.status}`);
            }

            const data = await response.json();

            if (data.status === 'success' && data.results && data.results.length > 0) {
                let htmlResults = '';
                
                data.results.forEach(item => {
                    htmlResults += `
                        <div class="result-card">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <span class="badge">SOURCE : ${item.source || 'F9UM API'}</span>
                                <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">TYPE : ${item.type || 'MULTI'}</span>
                            </div>
                            <div class="field-box">
                                <p style="color: var(--text-main); font-size: 0.95rem; font-family: var(--font-mono); white-space: pre-line; word-break: break-all;">
                                    ${item.data}
                                </p>
                            </div>
                        </div>
                    `;
                });
                area.innerHTML = htmlResults;
            } else {
                area.innerHTML = `
                    <div class="result-card">
                        <div class="field-box" style="border-left-color: var(--neon-cyan);">
                            <p style="color: var(--neon-cyan); font-family: var(--font-mono);">Aucun résultat trouvé pour ces critères.</p>
                        </div>
                    </div>
                `;
            }

        } catch (err) {
            let detail = err.message;
            if (err.name === 'AbortError') detail = "Le serveur Render a mis trop de temps à répondre (Timeout).";

            area.innerHTML = `
                <div class="result-card" style="border-color: rgba(239, 68, 68, 0.5);">
                    <div class="field-box" style="border-left-color: #ef4444;">
                        <p style="color: #ef4444; font-weight: 700; margin-bottom: 5px;">Erreur de communication</p>
                        <p style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-mono);">${detail}</p>
                    </div>
                </div>
            `;
        }
    }
</script>

</body>
</html>
