<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme de Recherche OSINT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #38bdf8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #0369a1;
        }

        .results-box {
            margin-top: 1.75rem;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 1rem;
            display: none;
        }

        .results-box h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            color: #38bdf8;
        }

        .status-loading {
            color: #f59e0b;
        }

        .status-error {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Outil d'Investigation OSINT</h1>
        <p class="subtitle">Recherche ciblée sur les données publiques</p>

        <div class="form-group">
            <label for="moduleSelect">Type de recherche :</label>
            <select id="moduleSelect" onchange="updatePlaceholder()">
                <option value="email">Adresse E-mail</option>
                <option value="phone">Numéro de Téléphone</option>
                <option value="fullname">Nom & Prénom</option>
            </select>
        </div>

        <div class="form-group">
            <label for="queryInput">Cible :</label>
            <input type="text" id="queryInput" placeholder="ex: exemple@gmail.com">
        </div>

        <button onclick="lancerRecherche()">Lancer la recherche</button>

        <div class="results-box" id="resultsContainer">
            <h3>Résultats de l'analyse :</h3>
            <pre id="resultsContent"></pre>
        </div>
    </div>

    <script>
        function updatePlaceholder() {
            const module = document.getElementById('moduleSelect').value;
            const input = document.getElementById('queryInput');
            
            if (module === 'email') {
                input.placeholder = "ex: cible@gmail.com";
            } else if (module === 'phone') {
                input.placeholder = "ex: 0612345678 ou +33612345678";
            } else if (module === 'fullname') {
                input.placeholder = "ex: Jean Dupont";
            }
        }

        async function lancerRecherche() {
            const query = document.getElementById('queryInput').value.trim();
            const module = document.getElementById('moduleSelect').value;
            const container = document.getElementById('resultsContainer');
            const content = document.getElementById('resultsContent');

            if (!query) {
                alert("Veuillez entrer une cible avant de lancer la recherche.");
                return;
            }

            container.style.display = "block";
            content.className = "status-loading";
            content.innerText = "Recherche en cours dans la base de données...";

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ query: query, module: module })
                });

                const data = await response.json();

                if (response.ok) {
                    content.className = "";
                    content.innerText = JSON.stringify(data, null, 2);
                } else {
                    content.className = "status-error";
                    content.innerText = "Erreur : " + (data.error || "Une erreur est survenue.");
                }

            } catch (error) {
                content.className = "status-error";
                content.innerText = "Erreur de connexion avec le serveur.";
            }
        }
    </script>

</body>
</html>
